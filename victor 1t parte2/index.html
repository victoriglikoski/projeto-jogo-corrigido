<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🎮 Aula 06 - Criando Inimigos</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.5.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.5.1/core.js">
    </script>

</head>

<body>

    <main>

        <h1>🎮 Criando Inimigos</h1>

        <p>
            Use as setas para movimentar o jogador.
        </p>

        <div class="placar">

            ⭐ Pontos:
            <span id="placar">0</span>

        </div>

        <div id="jogo">

            <!-- Jogador -->
            <div id="jogador">
                🧑‍🚀
            </div>

            <!-- Moeda -->
            <div id="moeda">
                🪙
            </div>

            <!-- Inimigo -->
            <div id="inimigo">
                👾
            </div>

        </div>

        <p id="mensagem">
            Cuidado com o inimigo! 👾
        </p>

    </main>

    <script type="py"
            src="jogo.py">
    </script>

</body>

</html>
